name: Timelet
options:
  bundleIdPrefix: com.timelet
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Timelet:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Timelet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timelet.app
        PRODUCT_NAME: Timelet
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_LSUIElement: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: "Timelet"
        INFOPLIST_KEY_CFBundleDisplayName: Timelet

  TimeletTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TimeletTests
    dependencies:
      - target: Timelet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.timelet.tests

# Declared explicitly so a shared scheme is written to the generated project.
# Xcode creates one implicitly when you open the project, but CI never does —
# without this `xcodebuild -scheme Timelet` fails on a fresh checkout.
schemes:
  Timelet:
    build:
      targets:
        Timelet: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TimeletTests
      # The tests run inside the app: keep it off the real store.
      environmentVariables:
        TIMELET_IN_MEMORY: "1"
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
