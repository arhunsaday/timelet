name: CI

# Fast "does it still compile" check. Deliberately narrow: this is a private
# repo, and macOS runners bill at 10x the Linux rate, so it only runs on `main`
# and on pull requests — not on every push to every branch.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "design-handoff/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "design-handoff/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Debug)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # `test` builds the app first, so this is also the "does it compile" check.
      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Timelet.xcodeproj \
            -scheme Timelet \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO
